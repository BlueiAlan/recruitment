server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-interview-backend
  mvc:
    problemdetails:
      enabled: false

ai:
  provider: ${AI_PROVIDER:openai}
  apiKey: ${AI_API_KEY:}
  endpoint: ${AI_ENDPOINT:}
  model: ${AI_MODEL:}
  timeoutMs: ${AI_TIMEOUT_MS:10000}

logging:
  level:
    root: INFO
    com.company.aiinterview: DEBUG
